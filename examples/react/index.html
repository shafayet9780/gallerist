<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visora — React gallery</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #1b2233 0%, #0c0e14 60%);
        color: #e7e9ee;
        min-height: 100vh;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      h1 {
        font-size: 44px;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      .lede {
        font-size: 17px;
        line-height: 1.5;
        color: #aab2c5;
        margin: 0 0 24px;
        max-width: 52ch;
      }
      button.open {
        padding: 12px 22px;
        font: 600 15px system-ui;
        color: #fff;
        background: #378add;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button.open:hover {
        background: #2f7ac6;
      }
      .hint {
        margin-top: 20px;
        font-size: 13px;
        line-height: 1.7;
        color: #7e879c;
        max-width: 56ch;
      }
      kbd {
        font: 600 11px ui-monospace, monospace;
        background: #232838;
        border: 1px solid #333a4f;
        border-radius: 4px;
        padding: 1px 6px;
      }
      /* portal-bridge bits rendered inside the viewer */
      .vbadge {
        background: var(--visora-accent, #378add);
        color: #fff;
        padding: 5px 11px;
        border-radius: 6px;
        font: 600 12px system-ui;
        letter-spacing: 0.02em;
      }
      .vcaption {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font: 14px system-ui;
        color: #fff;
        background: rgb(10 10 14 / 0.5);
        backdrop-filter: blur(20px);
      }
      .vcaption .vpos {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        color: #aab2c5;
      }
      .vpin {
        font: 600 13px system-ui;
        color: #fff;
        background: rgb(0 0 0 / 0.55);
        padding: 4px 9px;
        border-radius: 999px;
        white-space: nowrap;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
