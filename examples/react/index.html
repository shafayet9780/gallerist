<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visora — playground</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2f3f5;
        --muted: #9aa0ab;
        --amber: #ffb000;
        --panel: #16181d;
        --panel-2: #1b1e25;
        --hairline: rgb(255 255 255 / 0.1);
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(110% 90% at 80% -10%, rgb(255 176 0 / 0.08), transparent 60%),
          #0e0f12;
        color: var(--ink);
        min-height: 100vh;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 64px 24px 96px;
      }
      .eyebrow {
        font: 600 12px var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--amber);
        margin: 0 0 14px;
      }
      h1 {
        font-size: clamp(40px, 8vw, 68px);
        line-height: 0.96;
        letter-spacing: -0.03em;
        margin: 0 0 16px;
        font-weight: 680;
      }
      .lede {
        font-size: 17px;
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 32px;
        max-width: 60ch;
      }

      /* ── control panel ─────────────────────────────────────────────── */
      .panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      fieldset.group {
        margin: 0;
        padding: 14px 16px 16px;
        border: 1px solid var(--hairline);
        border-radius: 14px;
        background: rgb(255 255 255 / 0.02);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      fieldset.group legend {
        padding: 0 6px;
        font: 600 11px var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font: 600 11px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .field select,
      .field input[type="number"] {
        appearance: none;
        width: 100%;
        padding: 8px 11px;
        font: 500 14px system-ui;
        letter-spacing: 0;
        text-transform: none;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 9px;
        cursor: pointer;
      }
      .field select:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .field .def {
        font: 500 10px var(--mono);
        letter-spacing: 0;
        text-transform: none;
        color: var(--muted);
        opacity: 0.7;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        font: 500 13px system-ui;
        letter-spacing: 0;
        text-transform: none;
        color: var(--ink);
        cursor: pointer;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--amber);
        cursor: pointer;
      }
      select:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      /* ── actions + meta ────────────────────────────────────────────── */
      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
      }
      button.open {
        padding: 12px 24px;
        font: 600 15px system-ui;
        color: #15110a;
        background: var(--amber);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
      }
      button.open:hover {
        filter: brightness(1.07);
      }
      button.ghost {
        padding: 12px 18px;
        font: 600 13px system-ui;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--hairline);
        border-radius: 9px;
        cursor: pointer;
      }
      .preset-note {
        margin: 18px 0 0;
        font: 500 13px var(--mono);
        color: var(--amber);
        opacity: 0.85;
      }
      .hint {
        margin-top: 14px;
        font-size: 13px;
        line-height: 1.9;
        color: var(--muted);
        max-width: 70ch;
      }
      kbd {
        font: 600 11px var(--mono);
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 6px;
        color: var(--ink);
      }
      .snippet {
        margin-top: 26px;
        border: 1px solid var(--hairline);
        border-radius: 12px;
        background: var(--panel-2);
        overflow: hidden;
      }
      .snippet header {
        padding: 9px 14px;
        font: 600 11px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--hairline);
      }
      .snippet pre {
        margin: 0;
        padding: 16px;
        overflow-x: auto;
        font: 500 12.5px/1.7 var(--mono);
        color: #d7dbe2;
        tab-size: 2;
      }

      /* portal-bridge bits rendered inside the viewer */
      .vbadge {
        font: 600 11px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--amber);
        background: rgb(255 176 0 / 0.12);
        border: 1px solid rgb(255 176 0 / 0.3);
        padding: 5px 11px;
        border-radius: 999px;
      }
      .vchip {
        font: 600 12px var(--mono);
        color: #fff;
        background: rgb(14 15 18 / 0.6);
        border: 1px solid var(--hairline);
        padding: 6px 12px;
        border-radius: 999px;
        backdrop-filter: blur(20px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
