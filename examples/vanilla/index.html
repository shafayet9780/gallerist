<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visora — vanilla flat gallery</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
      }
      h1 {
        padding: 24px;
        font-weight: 500;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
        padding: 0 24px 24px;
      }
      .grid button {
        padding: 0;
        border: 0;
        cursor: pointer;
        aspect-ratio: 3 / 2;
        border-radius: 8px;
        overflow: hidden;
      }
      .grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Visora — flat gallery (the <code>items</code> front door)</h1>
    <div class="grid" id="grid"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
