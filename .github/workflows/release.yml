name: Release

# Manual-only until the first release: publishing is deliberately deferred, and an
# automatic trigger would publish on the first push to main once NPM_TOKEN exists.
# Run it from Actions → Release → "Run workflow". To restore auto-release, add back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # workflow_dispatch can target any branch; only ever release from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR / git tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # When changesets are present this opens/updates a version PR; when the version
      # PR merges, it runs `pnpm release` (changeset publish) to publish to npm.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
