name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || true # report known advisories; non-blocking
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      # Gate the published type-resolution surface (node10/node16 CJS+ESM/bundler).
      # theme-default is CSS-only (no types) and is excluded.
      - name: Check published types (are-the-types-wrong)
        run: |
          for d in packages/core packages/renderer-dom packages/react packages/plugin-*; do
            echo "::group::attw $d"
            pnpm dlx @arethetypeswrong/cli@0.18.5 --pack "$d" --profile node16
            echo "::endgroup::"
          done
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
