name: E2E

# Browser tests on every pull request, split into six parallel jobs (2 browsers × 3 shards) on
# standard GitHub-hosted runners, which are free for public repositories. A newer push to the same
# pull request cancels the run it replaces. Run it by hand from the Actions tab for any branch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Microsoft's Playwright image has the browsers and their system libraries installed, so a shard
    # doesn't spend its time on apt (a slow mirror once ate a 30-minute shard). Its tag must match the
    # Playwright version in pnpm-lock.yaml; a step below checks that.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The image matches the locked Playwright
        run: |
          locked=$(pnpm exec playwright --version | awk '{print $2}')
          test "$locked" = "1.61.0" || { echo "::error::pnpm-lock.yaml has Playwright $locked; update the container image tag in e2e.yml"; exit 1; }
      - name: Run shard ${{ matrix.shard }}/3
        env:
          HOME: /root # the image runs as root; the browsers expect its home
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One status for the whole matrix, so a pull request has a single check to look at.
  e2e-result:
    name: e2e
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e.result }}" = success
